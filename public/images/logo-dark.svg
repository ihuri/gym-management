<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 48" fill="none" class="h-8 w-auto">
    <defs>
        <linearGradient id="gm-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#A855F7" />
            <stop offset="50%" stop-color="#8B5CF6" />
            <stop offset="100%" stop-color="#6366F1" />
        </linearGradient>
        <linearGradient id="gm-accent-dark" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#F472B6" />
            <stop offset="100%" stop-color="#C084FC" />
        </linearGradient>
        <filter id="shadow-dark" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#A855F7" flood-opacity="0.45"/>
        </filter>
    </defs>

    <!-- Logo Icon: Stylized Hexagon + GM Dumbbell Monogram -->
    <g filter="url(#shadow-dark)">
        <!-- Outer Badge -->
        <path d="M24 4L42 14.3923V35.1769L24 45.5692L6 35.1769V14.3923L24 4Z" fill="url(#gm-grad-dark)" />
        
        <!-- Inner Gym Geometric Elements / GM Silhouette -->
        <!-- Dumbbell / Power Bar Icon -->
        <rect x="14" y="22.5" width="20" height="4" rx="2" fill="#FFFFFF" />
        <!-- Left Weight Plates -->
        <rect x="12" y="17" width="3.5" height="15" rx="1.5" fill="#FFFFFF" />
        <rect x="16.5" y="19" width="2.5" height="11" rx="1" fill="#F3E8FF" />
        <!-- Right Weight Plates -->
        <rect x="32.5" y="17" width="3.5" height="15" rx="1.5" fill="#FFFFFF" />
        <rect x="29" y="19" width="2.5" height="11" rx="1" fill="#F3E8FF" />
        <!-- Center Accent Diamond -->
        <polygon points="24,18 27,24.5 24,31 21,24.5" fill="url(#gm-accent-dark)" />
    </g>

    <!-- Typography: GM FITNESS -->
    <!-- GM -->
    <text x="56" y="32" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="24" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">
        GM
    </text>
    
    <!-- FITNESS -->
    <text x="106" y="32" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="24" font-weight="800" letter-spacing="3" fill="#C084FC">
        FITNESS
    </text>

    <!-- Subtitle / Tagline dot or accent line -->
    <circle cx="100" cy="27" r="2.5" fill="#E879F9" />
</svg>
